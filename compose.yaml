services:
  db:
    container_name: kinodb_mysql
    image: mysql:8.0

    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kinoDB
      MYSQL_USER: user
      MYSQL_PASSWORD: secret
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
    name: the_db_volume