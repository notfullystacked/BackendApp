spring.application.name=SmartBioBackend

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:kinoDB
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

## For use with mysql locally
#spring.datasource.url=jdbc:mysql://localhost:3306/kinoDB
#spring.datasource.username=${MYSQL_USERNAME}
#spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Testdata oprettes i config/InitData.java (ikke laengere i data.sql).
# never = Spring koerer ingen .sql-filer ved opstart, heller ikke en gammel data.sql der ligger tilbage i target/
spring.sql.init.mode=never

# Hvilke adresser frontenden maa kalde fra (CORS). Flere adskilles med komma.
# 63342 er IntelliJ's indbyggede webserver
kino.cors.allowed-origins=http://localhost:63342,http://127.0.0.1:63342
