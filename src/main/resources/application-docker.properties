
# MySQL Configurations (profilen "docker"). Databasen startes med: docker compose up -d
# Naar backenden selv koerer i Docker, overskriver compose.yaml adressen med SPRING_DATASOURCE_URL
spring.datasource.url=jdbc:mysql://localhost:3307/kinoDB?createDatabaseIfNotExist=true
spring.datasource.username=user
spring.datasource.password=secret
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
