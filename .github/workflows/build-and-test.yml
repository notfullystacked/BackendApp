name: Java CI with Maven
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]  
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'
          cache: maven

    # 1. Start MySQL container using your compose.yml
      - name: Start Docker Compose
        run: docker compose up -d

    # 2. Wait for MySQL to accept connections before running tests
      - name: Wait for MySQL to be ready
        run: |
          until docker exec kinodb_mysql mysqladmin ping -h "127.0.0.1" --silent; do
            echo "Waiting for MySQL container..."
            sleep 2
          done

    # 3. Run Maven tests with the docker profile active
      - name: Build and Test with Maven
        run: mvn test -Dspring.profiles.active=docker

    # 4. Cleanup containers after test execution
      - name: Stop Docker Compose
        if: always()
        run: docker compose down  


