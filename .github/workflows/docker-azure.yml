# Bygger Docker-imaget ud fra Dockerfile, sender det til Azure Container Registry (ACR)
# og opdaterer Azure Web App'en, så den kører det nye image.
#
# Kræver disse secrets i GitHub (Settings -> Secrets and variables -> Actions):
#   ACR_LOGIN_SERVER   fx  kinoregistry.azurecr.io
#   ACR_USERNAME       fra ACR -> Access keys (slå "Admin user" til)
#   ACR_PASSWORD       fra ACR -> Access keys
#   AZURE_WEBAPP_NAME  navnet på jeres Web App (fx kino-backend)
#   AZURE_WEBAPP_PUBLISH_PROFILE  indholdet af filen fra Web App -> "Download publish profile"

name: Docker image til Azure

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

env:
  IMAGE_NAME: kino-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Log ind i Azure Container Registry, så vi må pushe dertil
      - name: Log ind i ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Bygger med Dockerfile i roden og pusher to tags:
      # commit-hash (så man kan se præcis hvilken version der kører) og latest
      - name: Byg og push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fortæl Web App'en, at den skal køre det image vi lige har pushet
      - name: Deploy til Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
